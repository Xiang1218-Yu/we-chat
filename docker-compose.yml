version: '3.8'

services:
  # MongoDB 数据库
  mongodb:
    image: mongo:latest
    container_name: wechat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: wechat
    volumes:
      - mongodb_data:/data/db
    networks:
      - wechat-network

  # Redis 缓存
  redis:
    image: redis:latest
    container_name: wechat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wechat-network

volumes:
  mongodb_data:
  redis_data:

networks:
  wechat-network:
    driver: bridge