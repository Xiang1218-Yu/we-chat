<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 1200px;
            height: 700px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            overflow: hidden;
        }

        /* 登录界面 */
        .login-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 400px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .switch-form {
            text-align: center;
            margin-top: 20px;
        }

        .switch-form a {
            color: #667eea;
            text-decoration: none;
        }

        /* 聊天界面 */
        .chat-container {
            display: none;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 300px;
            background: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .user-info {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            margin-right: 10px;
        }

        .user-status {
            font-size: 12px;
            opacity: 0.8;
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .room-item {
            padding: 15px;
            margin-bottom: 5px;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .room-item:hover {
            background: #e9ecef;
        }

        .room-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .online-users {
            padding: 20px;
            border-top: 1px solid #e9ecef;
        }

        .online-users h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .online-user {
            display: inline-block;
            padding: 5px 10px;
            background: #e9ecef;
            border-radius: 15px;
            margin: 3px;
            font-size: 12px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: white;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-size: 18px;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.sent {
            align-items: flex-end;
        }

        .message.received {
            align-items: flex-start;
        }

        .message-sender {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            word-wrap: break-word;
        }

        .message.sent .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.received .message-content {
            background: white;
            color: #333;
        }

        .message-time {
            font-size: 11px;
            color: #999;
            margin-top: 5px;
        }

        .message-reactions {
            margin-top: 5px;
        }

        .reaction {
            display: inline-block;
            padding: 2px 8px;
            background: #e9ecef;
            border-radius: 10px;
            font-size: 12px;
            margin-right: 5px;
            cursor: pointer;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .input-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-controls button {
            padding: 8px 15px;
            background: #e9ecef;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .input-controls button:hover {
            background: #d3d9df;
        }

        .message-input {
            display: flex;
            gap: 10px;
        }

        .message-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
        }

        .message-input button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .typing-indicator {
            padding: 5px 20px;
            font-size: 12px;
            color: #666;
            font-style: italic;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #333;
            color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .emoji-picker {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: white;
            border-radius: 10px;
            padding: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .emoji-picker.show {
            display: block;
        }

        .emoji-picker span {
            font-size: 24px;
            cursor: pointer;
            margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录界面 -->
        <div class="login-container" id="loginContainer">
            <div class="login-box">
                <h2 id="formTitle">登录</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group" id="emailGroup" style="display: none;">
                        <label>邮箱</label>
                        <input type="email" id="email">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="password" required>
                    </div>
                    <div class="form-group" id="nicknameGroup" style="display: none;">
                        <label>昵称</label>
                        <input type="text" id="nickname">
                    </div>
                    <button type="submit" class="btn">登录</button>
                </form>
                <div class="switch-form">
                    <span id="switchText">还没有账号？</span>
                    <a href="#" id="switchLink">注册</a>
                </div>
            </div>
        </div>

        <!-- 聊天界面 -->
        <div class="chat-container" id="chatContainer">
            <div class="sidebar">
                <div class="sidebar-header">
                    <div class="user-info">
                        <div class="user-avatar"></div>
                        <div>
                            <div id="currentUsername">用户名</div>
                            <div class="user-status">在线</div>
                        </div>
                    </div>
                    <button class="btn" onclick="logout()" style="padding: 8px; font-size: 12px;">退出登录</button>
                </div>
                
                <div class="room-list" id="roomList">
                    <div class="room-item active" data-room="public">
                        <strong>公共聊天室</strong>
                        <div style="font-size: 12px; color: #666;">所有人可见</div>
                    </div>
                </div>

                <div class="online-users">
                    <h3>在线用户</h3>
                    <div id="onlineUsersList"></div>
                </div>
            </div>

            <div class="chat-area">
                <div class="chat-header">
                    <h2 id="currentRoomName">公共聊天室</h2>
                    <button onclick="createRoom()" style="padding: 8px 15px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">创建聊天室</button>
                </div>

                <div class="messages" id="messages"></div>

                <div class="typing-indicator" id="typingIndicator" style="display: none;">
                    有人正在输入...
                </div>

                <div class="input-area">
                    <div class="input-controls">
                        <button onclick="document.getElementById('imageUpload').click()">📷 图片</button>
                        <button onclick="document.getElementById('fileUpload').click()">📎 文件</button>
                        <button onclick="toggleEmojiPicker()">😊 表情</button>
                    </div>
                    
                    <input type="file" id="imageUpload" accept="image/*" style="display: none" onchange="uploadImage(this)">
                    <input type="file" id="fileUpload" style="display: none" onchange="uploadFile(this)">
                    
                    <div class="emoji-picker" id="emojiPicker">
                        <span onclick="addEmoji('😀')">😀</span>
                        <span onclick="addEmoji('😂')">😂</span>
                        <span onclick="addEmoji('😍')">😍</span>
                        <span onclick="addEmoji('🤔')">🤔</span>
                        <span onclick="addEmoji('👍')">👍</span>
                        <span onclick="addEmoji('❤️')">❤️</span>
                        <span onclick="addEmoji('🎉')">🎉</span>
                        <span onclick="addEmoji('🔥')">🔥</span>
                    </div>

                    <div class="message-input">
                        <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
                        <button onclick="sendMessage()">发送</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let currentUser = null;
        let currentRoom = 'public';
        let token = null;
        let isRegisterMode = false;

        const API_BASE = 'http://localhost:8080/api';

        // 初始化
        document.getElementById('loginForm').addEventListener('submit', handleAuth);
        document.getElementById('switchLink').addEventListener('click', toggleAuthMode);

        function toggleAuthMode(e) {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            
            const formTitle = document.getElementById('formTitle');
            const emailGroup = document.getElementById('emailGroup');
            const nicknameGroup = document.getElementById('nicknameGroup');
            const switchText = document.getElementById('switchText');
            const switchLink = document.getElementById('switchLink');
            const submitBtn = document.querySelector('#loginForm .btn');
            
            if (isRegisterMode) {
                formTitle.textContent = '注册';
                emailGroup.style.display = 'block';
                nicknameGroup.style.display = 'block';
                switchText.textContent = '已有账号？';
                switchLink.textContent = '登录';
                submitBtn.textContent = '注册';
            } else {
                formTitle.textContent = '登录';
                emailGroup.style.display = 'none';
                nicknameGroup.style.display = 'none';
                switchText.textContent = '还没有账号？';
                switchLink.textContent = '注册';
                submitBtn.textContent = '登录';
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            const endpoint = isRegisterMode ? '/register' : '/login';
            const body = isRegisterMode ? {
                username,
                email: document.getElementById('email').value,
                password,
                nickname: document.getElementById('nickname').value || username
            } : { username, password };

            try {
                const response = await fetch(API_BASE + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();
                
                if (data.code === 200) {
                    if (isRegisterMode) {
                        showNotification('注册成功，请登录');
                        toggleAuthMode({ preventDefault: () => {} });
                    } else {
                        token = data.data.token;
                        currentUser = {
                            id: data.data.user_id,
                            username: data.data.username,
                            nickname: data.data.nickname
                        };
                        connectWebSocket();
                        showChat();
                    }
                } else {
                    showNotification(data.message);
                }
            } catch (error) {
                showNotification('网络错误');
            }
        }

        function connectWebSocket() {
            ws = new WebSocket(`ws://localhost:8080/ws?user_id=${currentUser.id}&username=${currentUser.username}`);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                joinRoom('public');
            };
            
            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
            
            ws.onclose = () => {
                console.log('WebSocket disconnected');
                setTimeout(connectWebSocket, 3000);
            };
        }

        function handleMessage(message) {
            switch (message.type) {
                case 'chat':
                    displayMessage(message.data);
                    break;
                case 'private':
                    displayPrivateMessage(message.data);
                    break;
                case 'join':
                    showNotification(`${message.data.username} 加入了聊天室`);
                    break;
                case 'leave':
                    showNotification(`${message.data.username} 离开了聊天室`);
                    break;
                case 'typing':
                    showTypingIndicator(message.data);
                    break;
                case 'online_users':
                    updateOnlineUsers(message.data);
                    break;
                case 'notification':
                    showNotification(message.data.message);
                    break;
            }
        }

        function showChat() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';
            document.getElementById('currentUsername').textContent = currentUser.nickname || currentUser.username;
            loadRooms();
        }

        async function loadRooms() {
            try {
                const response = await fetch(API_BASE + '/rooms', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.code === 200) {
                    const roomList = document.getElementById('roomList');
                    data.data.forEach(room => {
                        const roomElement = document.createElement('div');
                        roomElement.className = 'room-item';
                        roomElement.setAttribute('data-room', room.room_id);
                        roomElement.innerHTML = `
                            <strong>${room.name}</strong>
                            <div style="font-size: 12px; color: #666;">${room.members} 人</div>
                        `;
                        roomElement.onclick = () => selectRoom(room.room_id, room.name);
                        roomList.appendChild(roomElement);
                    });
                }
            } catch (error) {
                console.error('Failed to load rooms:', error);
            }
        }

        function selectRoom(roomId, roomName) {
            currentRoom = roomId;
            document.getElementById('currentRoomName').textContent = roomName;
            
            document.querySelectorAll('.room-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-room="${roomId}"]`).classList.add('active');
            
            document.getElementById('messages').innerHTML = '';
            loadRoomMessages(roomId);
        }

        async function loadRoomMessages(roomId) {
            try {
                const response = await fetch(`${API_BASE}/rooms/${roomId}/messages`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                
                if (data.code === 200) {
                    data.data.forEach(msg => displayMessage(msg));
                }
            } catch (error) {
                console.error('Failed to load messages:', error);
            }
        }

        function joinRoom(roomId) {
            const message = {
                type: 'join',
                data: { room_id: roomId },
                timestamp: new Date().toISOString()
            };
            ws.send(JSON.stringify(message));
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            
            if (!content) return;
            
            const message = {
                type: 'chat',
                data: {
                    room_id: currentRoom,
                    content: content,
                    type: 'text'
                },
                timestamp: new Date().toISOString()
            };
            
            ws.send(JSON.stringify(message));
            input.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            } else {
                // 发送正在输入状态
                ws.send(JSON.stringify({
                    type: 'typing',
                    data: { room_id: currentRoom },
                    timestamp: new Date().toISOString()
                }));
            }
        }

        function displayMessage(msg) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            
            const isSent = msg.sender_id === currentUser.id;
            messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
            
            const time = new Date(msg.created_at).toLocaleTimeString();
            
            messageDiv.innerHTML = `
                <div class="message-sender">${msg.sender_name}</div>
                <div class="message-content">${msg.content}</div>
                <div class="message-time">${time}</div>
                ${msg.reactions && msg.reactions.length > 0 ? `
                    <div class="message-reactions">
                        ${msg.reactions.map(r => `<span class="reaction">${r.emoji}</span>`).join('')}
                    </div>
                ` : ''}
            `;
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function displayPrivateMessage(msg) {
            showNotification(`收到来自 ${msg.sender_name} 的私信: ${msg.content}`);
            displayMessage(msg);
        }

        function showTypingIndicator(data) {
            const indicator = document.getElementById('typingIndicator');
            if (data.user_id !== currentUser.id) {
                indicator.textContent = `${data.username} 正在输入...`;
                indicator.style.display = 'block';
                setTimeout(() => {
                    indicator.style.display = 'none';
                }, 2000);
            }
        }

        function updateOnlineUsers(users) {
            const usersList = document.getElementById('onlineUsersList');
            usersList.innerHTML = users.map(user => 
                `<span class="online-user">${user}</span>`
            ).join('');
        }

        function toggleEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            picker.classList.toggle('show');
        }

        function addEmoji(emoji) {
            const input = document.getElementById('messageInput');
            input.value += emoji;
            input.focus();
            toggleEmojiPicker();
        }

        async function uploadImage(input) {
            const file = input.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('image', file);
            
            try {
                const response = await fetch(API_BASE + '/upload/image', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                
                const data = await response.json();
                if (data.code === 200) {
                    ws.send(JSON.stringify({
                        type: 'chat',
                        data: {
                            room_id: currentRoom,
                            content: data.data.url,
                            type: 'image',
                            media_url: data.data.url
                        },
                        timestamp: new Date().toISOString()
                    }));
                }
            } catch (error) {
                showNotification('图片上传失败');
            }
            
            input.value = '';
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch(API_BASE + '/upload/file', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                
                const data = await response.json();
                if (data.code === 200) {
                    ws.send(JSON.stringify({
                        type: 'chat',
                        data: {
                            room_id: currentRoom,
                            content: `📎 ${data.data.filename}`,
                            type: 'file',
                            media_url: data.data.url
                        },
                        timestamp: new Date().toISOString()
                    }));
                }
            } catch (error) {
                showNotification('文件上传失败');
            }
            
            input.value = '';
        }

        async function createRoom() {
            const name = prompt('输入聊天室名称:');
            if (!name) return;
            
            try {
                const response = await fetch(API_BASE + '/rooms', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, type: 'public' })
                });
                
                const data = await response.json();
                if (data.code === 200) {
                    showNotification('聊天室创建成功');
                    loadRooms();
                }
            } catch (error) {
                showNotification('创建失败');
            }
        }

        async function logout() {
            try {
                await fetch(API_BASE + '/logout', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                ws.close();
                document.getElementById('loginContainer').style.display = 'flex';
                document.getElementById('chatContainer').style.display = 'none';
                token = null;
                currentUser = null;
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }

        // 点击其他地方关闭表情选择器
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.emoji-picker') && !e.target.closest('button')) {
                document.getElementById('emojiPicker').classList.remove('show');
            }
        });
    </script>
</body>
</html>
